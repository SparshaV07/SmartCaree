<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCare — Caregiver Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-shell">
    <div class="auth-brand">
      <div class="brand-mark">SC</div>
      <h1>SmartCare</h1>
      <p class="brand-tag">Caregiver console</p>
      <div class="brand-vitals">
        <div class="vital-line"></div>
        <div class="vital-line short"></div>
        <div class="vital-line"></div>
      </div>
      <p class="brand-note">Every dose, every visit, every resident — tracked in one place.</p>
    </div>

    <div class="auth-panel">
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="login">Log in</button>
        <button class="tab-btn" data-tab="register">Register</button>
      </div>

      <form id="login-form" class="auth-form">
        <label>Email
          <input type="email" id="login-email" required placeholder="you@example.com">
        </label>
        <label>Password
          <input type="password" id="login-password" required placeholder="••••••••">
        </label>
        <p class="form-error" id="login-error"></p>
        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <form id="register-form" class="auth-form hidden">
        <label>Full name
          <input type="text" id="register-name" required placeholder="Jane Fernandes">
        </label>
        <label>Email
          <input type="email" id="register-email" required placeholder="you@example.com">
        </label>
        <label>Password
          <input type="password" id="register-password" required placeholder="At least 6 characters">
        </label>
        <p class="form-error" id="register-error"></p>
        <button type="submit" class="btn-primary">Create account</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
