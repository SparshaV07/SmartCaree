<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCare — Appointments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page" data-page="appointments">

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <header class="view-header">
        <h2>Appointments</h2>
        <p>Upcoming visits and checkups.</p>
        <button class="btn-primary sm" id="add-appointment-btn">+ Add appointment</button>
      </header>

      <table class="data-table">
        <thead>
          <tr><th>Resident</th><th>Date</th><th>Description</th></tr>
        </thead>
        <tbody id="appointments-table-body">
          <tr><td colspan="3" class="empty-row">Loading…</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="appointment-modal">
    <form class="modal" id="appointment-form">
      <h3>Add appointment</h3>
      <label>Resident
        <select id="appointment-resident" required></select>
      </label>
      <label>Date<input type="date" id="appointment-date" required></label>
      <label>Description<input type="text" id="appointment-description" placeholder="e.g. Dr. Rao — cardiology checkup" required></label>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" data-close="appointment-modal">Cancel</button>
        <button type="submit" class="btn-primary">Save</button>
      </div>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/appointments.js"></script>
  <script src="js/auth-guard.js"></script>
</body>
</html>
