<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartCare — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page" data-page="dashboard">

  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <header class="view-header">
        <h2>Overview</h2>
        <p>A quick read on how your residents are doing today.</p>
      </header>

      <div class="stat-grid">
        <div class="stat-card">
          <span class="stat-label">Residents</span>
          <span class="stat-value" id="stat-residents">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Doses today</span>
          <span class="stat-value" id="stat-doses">—</span>
        </div>
        <div class="stat-card alert-tone">
          <span class="stat-label">Missed doses</span>
          <span class="stat-value" id="stat-missed">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Upcoming visits</span>
          <span class="stat-value" id="stat-appointments">—</span>
        </div>
      </div>

      <h3 class="subhead">Recent alerts</h3>
      <div id="overview-alerts" class="alert-list"></div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/auth-guard.js"></script>
</body>
</html>
