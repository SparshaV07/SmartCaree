<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in · SmartCare</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-body">

<div class="login-screen">
  <div class="login-story">
    <div class="login-brand">
  <img src="assets/logo/smartcare-logo-dark.svg" alt="SmartCare" class="login-logo">
</div>
    <p class="login-quote">
      Every Remainder is an act of care, <span>and every moment of attention</span>  makes the difference.
      
    </p>
    <div class="login-strip">
      <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
    </div>
  </div>

  <div class="login-panel">
    <div class="login-card">
      <h1 id="form-title">Welcome back</h1>
      <p class="sub" id="form-sub">Log in to continue caring for your residents.</p>

      <div class="login-error" id="login-error"></div>

      <form id="login-form" class="login-form">
        <div class="form-group" id="name-group" style="display:none;">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Jordan Lee" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@carehome.org" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary login-submit" id="login-submit">Log in</button>
      </form>

      <div class="login-foot">
        <a href="#" id="forgot-link">Forgot password?</a>
        &nbsp;·&nbsp;
        <a href="#" id="toggle-mode">New here? Create an account</a>
      </div>
    </div>
  </div>
</div>

<div id="toast-stack"></div>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/login.js"></script>
</body>
</html>
