<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Appointments · CareTrack</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-layout">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="shift-strip"></div>
    <header class="topbar">
      <div>
        <span class="page-eyebrow">Schedule</span>
        <h1>Appointments</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="add-appt-btn">+ Add appointment</button>
      </div>
    </header>

    <main class="page-content">
      <div class="card">
        <div class="flex-between mb-16">
          <div class="search-input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Search title, resident, or doctor…" />
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Appointment</th>
                <th>Resident</th>
                <th>Doctor</th>
                <th>Date</th>
                <th>Location</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="appts-body"></tbody>
          </table>
        </div>

        <div class="empty-state" id="appts-empty" style="display:none;">
          <h3>No appointments found</h3>
          <p>Schedule an appointment to see it appear here.</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Appointment Modal -->
<div class="modal-overlay" id="appt-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="appt-modal-title">Add appointment</h3>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <form id="appt-form">
      <div class="modal-body">
        <div class="form-group">
          <label for="a-title">Title</label>
          <input type="text" id="a-title" name="title" placeholder="e.g. Cardiology check-up" required />
        </div>
        <div class="form-group">
          <label for="a-resident">Resident</label>
          <select id="a-resident" name="residentId" required></select>
        </div>
        <div class="form-group">
          <label for="a-doctor">Doctor / provider</label>
          <input type="text" id="a-doctor" name="doctor" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="a-date">Date</label>
            <input type="date" id="a-date" name="date" required />
          </div>
          <div class="form-group">
            <label for="a-time">Time</label>
            <input type="time" id="a-time" name="time" />
          </div>
        </div>
        <div class="form-group">
          <label for="a-location">Location</label>
          <input type="text" id="a-location" name="location" placeholder="e.g. Main Street Clinic" />
        </div>
        <div class="form-group">
          <label for="a-status">Status</label>
          <select id="a-status" name="status">
            <option value="upcoming">Upcoming</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        <div class="form-group">
          <label for="a-notes">Notes</label>
          <textarea id="a-notes" name="notes"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="appt-delete-btn" style="margin-right:auto;display:none;">Delete</button>
        <button type="button" class="btn btn-outline" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">Save appointment</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-stack"></div>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/appointments.js"></script>
</body>
</html>
