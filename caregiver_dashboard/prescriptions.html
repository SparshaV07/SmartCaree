<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prescriptions · CareTrack</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-layout">
  <div id="sidebar-container"></div>

  <div class="main-content">
    <div class="shift-strip"></div>
    <header class="topbar">
      <div>
        <span class="page-eyebrow">Records</span>
        <h1>Prescriptions</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="add-rx-btn">+ Add prescription</button>
      </div>
    </header>

    <main class="page-content">
      <div class="card">
        <div class="flex-between mb-16">
          <div class="search-input-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Search medication, resident, or prescriber…" />
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Medication</th>
                <th>Resident</th>
                <th>Prescribed by</th>
                <th>Issued</th>
                <th>Expires</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rx-body"></tbody>
          </table>
        </div>

        <div class="empty-state" id="rx-empty" style="display:none;">
          <h3>No prescriptions found</h3>
          <p>Add a prescription record to keep track of expiry dates.</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add/Edit Prescription Modal -->
<div class="modal-overlay" id="rx-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="rx-modal-title">Add prescription</h3>
      <button class="modal-close" data-close-modal>✕</button>
    </div>
    <form id="rx-form">
      <div class="modal-body">
        <div class="form-group">
          <label for="rx-med-name">Medication name</label>
          <input type="text" id="rx-med-name" name="medicationName" required />
        </div>
        <div class="form-group">
          <label for="rx-resident">Resident</label>
          <select id="rx-resident" name="residentId" required></select>
        </div>
        <div class="form-group">
          <label for="rx-prescriber">Prescribed by</label>
          <input type="text" id="rx-prescriber" name="prescribedBy" placeholder="Dr. name" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="rx-issued">Date issued</label>
            <input type="date" id="rx-issued" name="dateIssued" />
          </div>
          <div class="form-group">
            <label for="rx-expiry">Expiry date</label>
            <input type="date" id="rx-expiry" name="expiryDate" />
          </div>
        </div>
        <div class="form-group">
          <label for="rx-notes">Notes</label>
          <textarea id="rx-notes" name="notes"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" id="rx-delete-btn" style="margin-right:auto;display:none;">Delete</button>
        <button type="button" class="btn btn-outline" data-close-modal>Cancel</button>
        <button type="submit" class="btn btn-primary">Save prescription</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-stack"></div>
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/prescriptions.js"></script>
</body>
</html>
